name: Identity persistence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Native test dependencies
        run: |
          # The regional HTTP archive stalled the previous job at 80 kB/s.
          # Keep Ubuntu's signed suites/keys and use its canonical HTTPS archive.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's|http://([a-zA-Z0-9-]+\.)*archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools libqt6svg6 libssl-dev g++ make qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-templates
      - name: Preserve identity on restart and reject damaged settings
        run: |
          work="$RUNNER_TEMP/identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$work"
          cd "$work"
          qmake6 "$GITHUB_WORKSPACE/tests/identity-persistence.pro"
          make -j2
          ./identity-persistence-test
      - name: Fork update channel regressions
        env:
          DESKPORT_QMAKE: qmake6
        run: python3 tests/test-update-checker.py
      - name: Independent bandwidth and pacing controls
        env:
          DESKPORT_QMAKE: qmake6
          DESKPORT_LRELEASE: /usr/lib/qt6/bin/lrelease
        run: python3 tests/test-host-lifecycle.py --ui -- deviceSettingsAreSeparate navigationAndDeviceIdentity managedSessionNavigation
      - name: Bounded read-only management recovery
        env:
          DESKPORT_QMAKE: qmake6
        run: python3 tests/test-host-lifecycle.py --binding -- managementReadinessRetriesAreBoundedAndNeverReplayWrites adaptiveDisplayRequiresPinnedApprovedExclusiveController
      - name: Persist and export management failure logs
        env:
          DESKPORT_QMAKE: qmake6
        run: python3 tests/test-diagnostics.py
