name: Intel Big Sur compatibility

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, client]
        default: full
        description: Full package or isolated client checkpoint
      release_tag:
        description: Existing draft release tag
        default: v2.9.0-imac.1
        required: true

permissions:
  contents: read

jobs:
  client:
    if: inputs.mode == 'client'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.7'
      DESKPORT_MACOS_PROFILE: intel-bigsur
      DESKPORT_MACOS_ARCH: x86_64
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Portable compatibility checks
        run: |
          python3 tests/test-macos-legacy.py
          python3 scripts/check-macos-target.py libs/mac --arch x86_64
      - name: Install Big Sur compatible Qt
        run: |
          python3 -m venv "$RUNNER_TEMP/qt-installer"
          "$RUNNER_TEMP/qt-installer/bin/pip" install aqtinstall==3.3.0
          "$RUNNER_TEMP/qt-installer/bin/python" -m aqt install-qt mac desktop 6.5.3 clang_64 --outputdir "$RUNNER_TEMP/qt"
      - name: Compile client and native adapters
        run: |
          mkdir -p "$RUNNER_TEMP/deskport-client"
          cd "$RUNNER_TEMP/deskport-client"
          "$RUNNER_TEMP/qt/6.5.3/macos/bin/qmake" -r "$GITHUB_WORKSPACE/moonlight-qt.pro" CONFIG+=release CONFIG-=debug_and_release CONFIG+=imac_bigsur
          make -j3
      - name: Deploy client Qt runtime
        run: |
          export PATH="$RUNNER_TEMP/qt/6.5.3/macos/bin:$PATH"
          export DESKPORT_QT_LIBRARY_PATH="$(qmake -query QT_INSTALL_LIBS)"
          python3 scripts/deploy-macos-runtime.py "$RUNNER_TEMP/deskport-client/app/DeskPort.app" app
          python3 scripts/fix-macos-dependencies.py "$RUNNER_TEMP/deskport-client/app/DeskPort.app"
          python3 scripts/check-macos-target.py "$RUNNER_TEMP/deskport-client/app/DeskPort.app" --arch x86_64 > "$RUNNER_TEMP/macos-target.json"
      - name: Mark client-only development candidate
        run: |
          echo 'Client compilation candidate only. Bundled host, screen selection, Big Sur runtime and end-to-end acceptance are not certified.' > "$RUNNER_TEMP/deskport-client/app/BUILD-SCOPE.txt"
          codesign --force --deep --sign - "$RUNNER_TEMP/deskport-client/app/DeskPort.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/deskport-client/app/DeskPort.app" "$RUNNER_TEMP/DeskPort-intel-bigsur-client-candidate.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intel-bigsur-client-candidate
          path: |
            ${{ runner.temp }}/macos-target.json
            ${{ runner.temp }}/deskport-client/app/BUILD-SCOPE.txt
          retention-days: 7
  full-package:
    if: inputs.mode == 'full'
    runs-on: macos-15-intel
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.7'
      DESKPORT_MACOS_PROFILE: intel-bigsur
      DESKPORT_MACOS_ARCH: x86_64
      DESKPORT_SIGN_IDENTITY: '-'
      DESKPORT_ALLOW_ADHOC: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Big Sur runtime regression checks
        run: python3 tests/test-macos-legacy.py
      - name: Install native build tools and compatible Qt
        run: |
          brew install cmake ninja pkgconf nasm
          python3 -m venv "$RUNNER_TEMP/qt-installer"
          "$RUNNER_TEMP/qt-installer/bin/pip" install aqtinstall==3.3.0
          "$RUNNER_TEMP/qt-installer/bin/python" -m aqt install-qt mac desktop 6.5.3 clang_64 --outputdir "$RUNNER_TEMP/qt"
          echo "DESKPORT_QT_BIN=$RUNNER_TEMP/qt/6.5.3/macos/bin" >> "$GITHUB_ENV"
          echo "DESKPORT_QT_LIBRARY_PATH=$RUNNER_TEMP/qt/6.5.3/macos/lib" >> "$GITHUB_ENV"
          echo "DESKPORT_LEGACY_DEPS_ROOT=$RUNNER_TEMP/deskport-build/dependencies.noindex/macos-intel-bigsur" >> "$GITHUB_ENV"
      - name: Existing-screen admission and adaptive display regressions
        env:
          DESKPORT_BUILD_ROOT: ${{ runner.temp }}/deskport-build
          DESKPORT_TEST_CASE: fixed-screen-admission
        run: |
          export DESKPORT_QMAKE="$DESKPORT_QT_BIN/qmake"
          python3 tests/test-host-lifecycle.py --binding -- selectedExistingDisplayKeepsAdmissionWithoutResize adaptiveDisplayRequiresPinnedApprovedExclusiveController
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        id: dependencies
        with:
          path: ${{ runner.temp }}/deskport-build/dependencies.noindex/macos-intel-bigsur
          key: macos-intel-bigsur-v1-${{ hashFiles('scripts/build-macos-legacy-deps.py', 'scripts/build-linux-libdatachannel.sh', 'winbuild/inputs.json', 'host/vendor/sunshine.json') }}
      - name: Build or verify pinned Intel dependencies
        run: DESKPORT_BUILD_ROOT="$RUNNER_TEMP/deskport-build" bash scripts/build.sh dependencies --target macos --run deps-${{ github.run_id }} --min-free-gib 5
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/deskport-build/dependencies.noindex/macos-intel-bigsur
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build and audit full Intel Big Sur package
        run: DESKPORT_BUILD_ROOT="$RUNNER_TEMP/deskport-build" bash scripts/build.sh package --target macos --run gha-${{ github.run_id }} --min-free-gib 5 --asset-suffix intel-bigsur
      - name: Stage development candidate in draft only
        env:
          GH_TOKEN: ${{ github.token }}
          DESKPORT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/stage-draft-release.py --target macos --tag "$DESKPORT_RELEASE_TAG" --root "$RUNNER_TEMP/deskport-build" --repo "$GITHUB_REPOSITORY"
      - name: Show sanitized build errors
        if: failure()
        run: python3 scripts/export-build-errors.py "$RUNNER_TEMP/deskport-build"
