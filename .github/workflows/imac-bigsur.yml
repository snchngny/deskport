name: Intel Big Sur compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.7'
      DESKPORT_MACOS_PROFILE: intel-bigsur
      DESKPORT_MACOS_ARCH: x86_64
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Portable compatibility checks
        run: |
          python3 tests/test-macos-legacy.py
          python3 scripts/check-macos-target.py libs/mac --arch x86_64
      - name: Install Big Sur compatible Qt
        run: |
          python3 -m venv "$RUNNER_TEMP/qt-installer"
          "$RUNNER_TEMP/qt-installer/bin/pip" install aqtinstall==3.3.0
          "$RUNNER_TEMP/qt-installer/bin/python" -m aqt install-qt mac desktop 6.5.3 clang_64 --outputdir "$RUNNER_TEMP/qt"
      - name: Compile client and native adapters
        run: |
          mkdir -p "$RUNNER_TEMP/deskport-client"
          cd "$RUNNER_TEMP/deskport-client"
          "$RUNNER_TEMP/qt/6.5.3/macos/bin/qmake" -r "$GITHUB_WORKSPACE/moonlight-qt.pro" CONFIG+=release CONFIG-=debug_and_release CONFIG+=imac_bigsur
          make -j3
      - name: Deploy client Qt runtime
        run: |
          export PATH="$RUNNER_TEMP/qt/6.5.3/macos/bin:$PATH"
          python3 scripts/deploy-macos-runtime.py "$RUNNER_TEMP/deskport-client/app/DeskPort.app" app
          python3 scripts/fix-macos-dependencies.py "$RUNNER_TEMP/deskport-client/app/DeskPort.app"
          python3 scripts/check-macos-target.py "$RUNNER_TEMP/deskport-client/app/DeskPort.app" --arch x86_64 > "$RUNNER_TEMP/macos-target.json"
      - name: Mark client-only development candidate
        run: |
          echo 'Client compilation candidate only. Bundled host, screen selection, Big Sur runtime and end-to-end acceptance are not certified.' > "$RUNNER_TEMP/deskport-client/app/BUILD-SCOPE.txt"
          codesign --force --deep --sign - "$RUNNER_TEMP/deskport-client/app/DeskPort.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/deskport-client/app/DeskPort.app" "$RUNNER_TEMP/DeskPort-intel-bigsur-client-candidate.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intel-bigsur-client-candidate
          path: |
            ${{ runner.temp }}/macos-target.json
            ${{ runner.temp }}/deskport-client/app/BUILD-SCOPE.txt
          retention-days: 7
